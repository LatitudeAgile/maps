schema: spec-driven

context: |
  Target: ArcGIS Maps SDK for JavaScript 5.x via npm + Vite, vanilla TypeScript (no UI
  framework). Use map components (arcgis-*) for all map UI. Never import widget UI classes
  from @arcgis/core/widgets/* (Search, Legend, Expand and the like) and never use
  view.ui.add/remove/move: widgets are deprecated at 5.0 and may be removed as early as
  Q1 2027. Exception: non-UI classes and objects under widgets/ that map components need
  as data, such as Search sources (widgets/Search/SearchSource), may be imported when no
  non-widgets equivalent exists. Keep each such import in one module, note it in the design,
  and replace it when the SDK moves it. Core API modules are fine for maps, layers, config,
  identity and reactiveUtils.

  UI uses Calcite components, Calcite design tokens and Calcite icons only. No Font
  Awesome, no other component libraries.

  Terminology: call UI pieces "components" (the 5.x term), not "widgets" (the 3.x term),
  in code, config, specs and docs. Keep "widget" only when naming SDK widget classes.

  The viewer is config-driven: map, layers, and components (including sidebar panels)
  come from config, not hard-coded markup. It must work against ArcGIS Location Platform, ArcGIS Online and
  ArcGIS Enterprise; portal and service URLs are configuration, never hard-coded to
  arcgis.com. Note that ArcGIS location services cannot be accessed with ArcGIS
  Enterprise API keys or Enterprise logins.

  Access model: anonymous use is the baseline, using an API key scoped only to the
  location services that need it (basemap styles, geocoding, routing) through
  esriConfig.apiKeys.basemapStyles or component-level api-key; do not set the global
  esriConfig.apiKey. Optional OAuth 2.0 user sign-in lets organizations load private
  content. Credentials are never committed. The demo uses an ArcGIS Location Platform
  free-tier key; deployers supply their own.

  Verify SDK behavior against version-matched docs at developers.arcgis.com and label
  anything unverified. Development is on Windows; npm scripts must be cross-platform.

rules:
  specs:
    - Every scenario describes behavior someone can check in the running app.
      Don't name a test tool; the project has no automated tests.
  tasks:
    - Each task states how it is verified, by a typecheck (`npm run check`) or
      by checking the behavior in the browser on the dev server; no tasks that
      write automated tests.
skillsScope: project
